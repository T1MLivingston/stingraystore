<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="../assets/school-seal.png" type="image/png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carrera de Banderas: The 21 Flag Race</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0E2A5E; --navy-deep:#081A3F; --red:#C8102E; --gold:#F4B223;
  --bg:#EDF1F9; --surface:#FFFFFF; --ink:#0E2A5E; --muted:#52618A; --line:#C6D0E6;
  --tile:#DCE4F3; --good:#12784C; --bad:#C8102E; --on-red:#FFFFFF;
  --font:"Montserrat","Avenir Next","Segoe UI",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#07142F; --surface:#0F2350; --ink:#EEF3FF; --muted:#A7B6DA; --line:#2A4380;
    --tile:#1B3268; --good:#41CF8F; --bad:#FF7088;
  }
}
:root[data-theme="dark"]{
  --bg:#07142F; --surface:#0F2350; --ink:#EEF3FF; --muted:#A7B6DA; --line:#2A4380;
  --tile:#1B3268; --good:#41CF8F; --bad:#FF7088;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-weight:500;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

/* ---------- papel picado band ---------- */
.band{background:var(--navy-deep);overflow:hidden;line-height:0}
.band svg{display:block;width:100%;height:clamp(60px,7vw,92px)}
.picado{transform-origin:50% 0;animation:sway 5s ease-in-out infinite alternate}
.picado:nth-child(even){animation-duration:6.2s;animation-direction:alternate-reverse}
@keyframes sway{from{transform:rotate(-1.6deg)}to{transform:rotate(1.6deg)}}
@media (prefers-reduced-motion: reduce){.picado{animation:none}}

.wrap{max-width:1080px;margin:0 auto;padding:clamp(14px,2.2vw,22px) clamp(14px,3vw,28px) 40px}

/* ---------- start ---------- */
.title{margin:0;font-weight:900;font-size:clamp(2rem,5.2vw,3.3rem);line-height:.98;letter-spacing:-.025em;text-wrap:balance}
.title span{display:block;color:var(--red)}
:root[data-theme="dark"] .title span{color:#FF5A72}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .title span{color:#FF5A72}}
.lede{margin:.5rem 0 0;font-size:clamp(.98rem,1.6vw,1.08rem);font-weight:600;color:var(--muted);max-width:46ch}
.setup{display:grid;gap:16px;margin-top:clamp(16px,2.4vw,22px)}
fieldset{border:0;padding:0;margin:0;min-width:0}
legend,.lbl{padding:0;font-weight:800;font-size:1rem;margin-bottom:7px;display:block}
.choices{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.choice{position:relative;display:block;cursor:pointer}
.choice input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.choice .card{display:block;height:100%;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:11px 15px 12px;transition:border-color .12s,transform .12s}
.choice .card b{display:block;font-weight:800;font-size:1.12rem}
.choice .card small{display:block;margin-top:3px;font-size:.92rem;font-weight:600;color:var(--muted)}
.choice .card .best{margin-top:6px;font-size:.84rem;font-weight:700;color:var(--muted)}
.choice input:checked + .card{border-color:var(--red);box-shadow:inset 0 0 0 2px var(--red)}
.choice input:focus-visible + .card{outline:3px solid var(--gold);outline-offset:3px}
.choice:hover .card{border-color:var(--ink)}
.mini{display:flex;gap:6px;margin-bottom:7px;align-items:center;font-weight:800;font-size:.9rem;color:var(--muted)}
.mini img{height:26px;width:auto;border-radius:3px;box-shadow:0 0 0 1px var(--line)}
.mini .arrow{font-weight:900}
.row{display:flex;flex-wrap:wrap;gap:14px 18px;align-items:end}
.name{flex:1 1 240px;max-width:340px}
.name input{width:100%;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-weight:700}
.name input::placeholder{color:var(--muted);font-weight:600}
.go{background:var(--red);color:var(--on-red);border:0;border-radius:12px;padding:14px 26px;font-weight:900;font-size:1.1rem;cursor:pointer;box-shadow:0 4px 0 #8C0B20}
.go:hover{filter:brightness(1.07)}
.go:active{transform:translateY(3px);box-shadow:0 1px 0 #8C0B20}
.ghost{background:transparent;border:2px solid var(--line);border-radius:12px;padding:12px 20px;font-weight:800;cursor:pointer}
.ghost:hover{border-color:var(--ink)}

/* ---------- game ---------- */
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;background:var(--navy);color:#fff;border-radius:14px;padding:10px 16px}
.hud .count{font-weight:800}
.hud .bar{flex:1 1 120px;height:10px;background:rgba(255,255,255,.2);border-radius:99px;overflow:hidden}
.hud .bar i{display:block;height:100%;width:0;background:var(--gold);border-radius:99px;transition:width .25s}
.hud .clock{font-weight:900;font-size:1.5rem;font-variant-numeric:tabular-nums;min-width:5.2ch;text-align:right}
.hud .miss{font-weight:800;font-variant-numeric:tabular-nums}
.hud .quit{background:transparent;border:2px solid rgba(255,255,255,.4);color:#fff;border-radius:9px;padding:5px 12px;font-weight:800;font-size:.88rem;cursor:pointer}
.hud .quit:hover{border-color:#fff}
.prompt{margin:16px 0 14px;text-align:center}
.prompt p{margin:0 0 8px;font-weight:700;color:var(--muted)}
.prompt .word{font-weight:900;font-size:clamp(2rem,6vw,3.4rem);line-height:1.05;letter-spacing:-.02em;text-wrap:balance}
.prompt .flag{display:inline-block;background:var(--tile);border-radius:12px;padding:10px}
.prompt .flag img{display:block;height:clamp(110px,19vh,170px);width:auto;max-width:100%;box-shadow:0 0 0 1px rgba(8,26,63,.25)}
.opts{display:grid;gap:10px}
.opts.flags{grid-template-columns:repeat(7,minmax(0,1fr))}
.opts.flags.four{grid-template-columns:repeat(4,minmax(0,1fr));max-width:780px;margin-inline:auto}
.opts.names{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:900px){.opts.names{grid-template-columns:repeat(3,minmax(0,1fr))}}
.opts.names.four{grid-template-columns:repeat(2,minmax(0,1fr));max-width:640px;margin-inline:auto}
@media (max-width:820px){.opts.flags{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media (max-width:560px){.opts.flags{grid-template-columns:repeat(3,minmax(0,1fr))}.opts.flags.four{grid-template-columns:repeat(2,minmax(0,1fr))}.opts.names{grid-template-columns:repeat(2,minmax(0,1fr))}}
.opt{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:12px;cursor:pointer;padding:0;transition:border-color .1s,transform .1s}
.opt:hover:not(:disabled){border-color:var(--ink);transform:translateY(-2px)}
.opt:disabled{cursor:default}
.opt.f{aspect-ratio:3/2;min-width:0;padding:7px;background:var(--tile)}
.opt.f img{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 0 .6px rgba(8,26,63,.7))}
.opt.n{min-width:0;padding:11px 10px;font-weight:800;font-size:1rem;text-align:center;min-height:48px}
.four .opt.n{padding:16px 12px;font-size:1.15rem}
.opt.right{border-color:var(--good);box-shadow:inset 0 0 0 3px var(--good)}
.opt.wrong{border-color:var(--bad);box-shadow:inset 0 0 0 3px var(--bad);animation:shake .28s}
.opt .mark{position:absolute;top:-9px;right:-9px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:.95rem;color:#fff;line-height:1}
.opt.right .mark{background:var(--good)}
.opt.wrong .mark{background:var(--bad)}
:root[data-theme="dark"] .opt .mark{color:#07142F}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .opt .mark{color:#07142F}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (prefers-reduced-motion: reduce){.opt.wrong{animation:none}.opt:hover:not(:disabled){transform:none}}
.say{min-height:1.6em;margin:12px 0 0;text-align:center;font-weight:800}
.say.ok{color:var(--good)} .say.no{color:var(--bad)}

/* ---------- results ---------- */
.result{background:var(--navy);color:#fff;border-radius:18px;padding:clamp(18px,3.5vw,32px);display:grid;gap:8px}
.result h2{margin:0;font-weight:900;font-size:clamp(1.5rem,3.6vw,2.2rem);line-height:1.1}
.result .who{margin:0;font-weight:700;color:#C9D6F5}
.result .big{font-weight:900;font-size:clamp(3.2rem,12vw,6rem);line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums;color:var(--gold);margin-top:6px}
.result .math{margin:0;font-weight:700;color:#C9D6F5;font-variant-numeric:tabular-nums}
.result .newbest{justify-self:start;background:var(--red);color:#fff;font-weight:900;border-radius:99px;padding:5px 14px;margin-top:4px}
.stats{display:flex;flex-wrap:wrap;gap:10px 34px;margin-top:12px;padding-top:14px;border-top:2px solid rgba(255,255,255,.18)}
.stats div b{display:block;font-weight:900;font-size:1.5rem;font-variant-numeric:tabular-nums}
.stats div span{font-weight:700;font-size:.9rem;color:#C9D6F5}
.review{margin-top:22px}
.review h3{margin:0 0 10px;font-weight:800;font-size:1.1rem}
.review ul{list-style:none;margin:0;padding:0;display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.review li{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:10px;text-align:center;font-weight:800}
.review li img{display:block;height:64px;width:auto;max-width:100%;margin:0 auto 8px;box-shadow:0 0 0 1px rgba(8,26,63,.22)}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}

.log{margin-top:clamp(22px,3.5vw,34px)}
.log h2{margin:0;font-weight:900;font-size:1.35rem}
.log .sub{margin:2px 0 12px;font-weight:600;color:var(--muted);font-size:.95rem}
.logbox{background:var(--surface);border:2px solid var(--line);border-radius:14px;overflow:auto;max-height:420px}
.log table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.log th,.log td{padding:9px 14px;text-align:left;white-space:nowrap}
.log th{position:sticky;top:0;background:var(--navy);color:#fff;font-weight:800;font-size:.86rem}
.log td{font-weight:700;border-top:1px solid var(--line)}
.log td.t{font-weight:900}
.log tr.me td{background:rgba(244,178,35,.3)}
.log .empty{margin:0;padding:18px 14px;font-weight:700;color:var(--muted)}
.logbtns{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.ghost.sm{padding:8px 14px;font-size:.9rem}
.ghost:disabled{opacity:.45;cursor:default}
.result .place{margin:0;font-weight:800;color:#fff}
.namemsg{margin:8px 0 0;min-height:1.4em;font-weight:800;color:var(--bad)}
.home{display:inline-block;margin-bottom:12px;font-weight:800;font-size:.92rem;color:var(--muted);text-decoration:none}
.home:hover{color:var(--ink)}
</style>
</head>
<body>
<div class="band" aria-hidden="true"><svg id="banner" viewBox="0 0 1200 120" preserveAspectRatio="xMidYMin slice"></svg></div>

<main class="wrap">
  <section id="start">
    <a class="home" href="../index.html">&larr; Back to the Stingray Store</a>
    <h1 class="title">Carrera de Banderas <span>The 21 flag race</span></h1>
    <p class="lede">You get a country. You find its flag. 21 countries, one clock. Every miss adds 10 seconds.</p>
    <div class="setup">
      <div class="row">
        <label class="name"><span class="lbl">Your name (goes in the race log)</span>
          <input id="who" type="text" maxlength="24" autocomplete="off" placeholder="First name"></label>
        <button class="go" id="startBtn" type="button">Start the race</button>
      </div>
    </div>
    <p class="namemsg" id="nameMsg" aria-live="polite"></p>
    <div class="log">
      <h2>Race log</h2>
      <p class="sub">Every finished race, fastest first. Saved on this device.</p>
      <div class="logbox" id="logbox"></div>
      <div class="logbtns">
        <button class="ghost sm" id="dl" type="button">Download log</button>
        <button class="ghost sm" id="clr" type="button">Clear log</button>
      </div>
    </div>
  </section>

  <section id="game" hidden>
    <div class="hud">
      <span class="count" id="count">1 of 21</span>
      <span class="bar"><i id="bar"></i></span>
      <span class="miss" id="miss">0 missed</span>
      <span class="clock" id="clock" role="timer" aria-label="Time">0:00.0</span>
      <button class="quit" id="quit" type="button">Quit</button>
    </div>
    <div class="prompt" id="prompt"></div>
    <div class="opts flags" id="opts"></div>
    <p class="say" id="say" aria-live="polite"></p>
  </section>

  <section id="results" hidden>
    <div class="result" id="card"></div>
    <div class="review" id="review"></div>
    <div class="actions">
      <button class="go" id="again" type="button">Race again</button>
      <button class="ghost" id="next" type="button">Next racer</button>
      <button class="ghost" id="seelog" type="button">See the race log</button>
    </div>
  </section>
</main>

const PENALTY = 10;
const $ = id => document.getElementById(id);
const byId = Object.fromEntries(FLAGS.map(f => [f.id, f]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fmt = s => { const m = Math.floor(s / 60), r = s - m * 60; return m + ":" + (r < 10 ? "0" : "") + r.toFixed(1); };
const esc = t => String(t).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* saved on this device; falls back to memory if storage is blocked */
const mem = {};
const store = {
  get(k, d) { try { const v = localStorage.getItem("cdb2:" + k); if (v !== null) return JSON.parse(v); } catch (e) {} return k in mem ? mem[k] : d; },
  set(k, v) { mem[k] = v; try { localStorage.setItem("cdb2:" + k, JSON.stringify(v)); } catch (e) {} }
};
const getLog = () => (store.get("log", []) || []).slice().sort((a, b) => a.final - b.final || a.at - b.at);
let lastAt = null;

/* ---------- papel picado banner ---------- */
(function banner() {
  const svg = $("banner"), NS = "http://www.w3.org/2000/svg";
  const colors = ["#C8102E", "#FFFFFF", "#F4B223", "#C8102E", "#FFFFFF", "#F4B223"];
  const el = (n, a) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); return e; };
  const yAt = x => { const t = x / 1200; return 8 + 72 * t * (1 - t); };
  svg.appendChild(el("path", { d: "M-10 8 Q600 44 1210 8", fill: "none", stroke: "#F4B223", "stroke-width": 2 }));
  const W = 92, H = 68, n = 11, gap = (1200 - n * W) / (n + 1);
  for (let i = 0; i < n; i++) {
    const x = gap + i * (W + gap), y = yAt(x + W / 2) - 1;
    let d = `M0 0H${W}V${H - 10}`;
    const teeth = 4, tw = W / teeth;
    for (let k = teeth; k > 0; k--) d += `L${(k - .5) * tw} ${H}L${(k - 1) * tw} ${H - 10}`;
    d += "Z";
    const cx = W / 2, cy = H / 2 - 4;
    if (i % 3 === 0) {            // sunburst
      for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4, r1 = 9, r2 = 21, w = .22;
        d += `M${cx + r1 * Math.cos(a - w)} ${cy + r1 * Math.sin(a - w)}L${cx + r2 * Math.cos(a)} ${cy + r2 * Math.sin(a)}L${cx + r1 * Math.cos(a + w)} ${cy + r1 * Math.sin(a + w)}Z`; }
      d += `M${cx - 6} ${cy}a6 6 0 1 0 12 0a6 6 0 1 0 -12 0Z`;
    } else if (i % 3 === 1) {     // diamonds
      const dia = (x0, y0, r) => `M${x0} ${y0 - r}L${x0 + r} ${y0}L${x0} ${y0 + r}L${x0 - r} ${y0}Z`;
      d += dia(cx, cy, 15) + dia(cx - 28, cy, 7) + dia(cx + 28, cy, 7) + dia(cx, cy - 22, 4) + dia(cx, cy + 22, 4);
    } else {                      // flower
      for (let k = 0; k < 6; k++) { const a = k * Math.PI / 3, px = cx + 13 * Math.cos(a), py = cy + 13 * Math.sin(a);
        d += `M${px - 6} ${py}a6 6 0 1 0 12 0a6 6 0 1 0 -12 0Z`; }
      d += `M${cx - 4} ${cy}a4 4 0 1 0 8 0a4 4 0 1 0 -8 0Z`;
    }
    for (const sx of [12, W - 12]) d += `M${sx - 3} 10a3 3 0 1 0 6 0a3 3 0 1 0 -6 0Z`;
    const g = el("g", { transform: `translate(${x} ${y})` });
    const p = el("path", { d, fill: colors[i % colors.length], "fill-rule": "evenodd", class: "picado" });
    p.style.transformBox = "fill-box";
    g.appendChild(p); svg.appendChild(g);
  }
})();

/* ---------- race log ---------- */
const when = at => new Date(at).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
function drawLog() {
  const log = getLog();
  $("dl").disabled = $("clr").disabled = !log.length;
  if (!log.length) { $("logbox").innerHTML = `<p class="empty">No races yet. Type your name and start the first one.</p>`; return; }
  $("logbox").innerHTML = `<table><thead><tr><th>Place</th><th>Name</th><th>Final time</th><th>Missed</th><th>Clock time</th><th>When</th></tr></thead><tbody>` +
    log.map((r, i) => `<tr class="${r.at === lastAt ? "me" : ""}"><td>${i + 1}</td><td>${esc(r.who)}</td><td class="t">${fmt(r.final)}</td><td>${r.misses}</td><td>${fmt(r.time)}</td><td>${when(r.at)}</td></tr>`).join("") +
    `</tbody></table>`;
}
$("dl").addEventListener("click", () => {
  const q = v => '"' + String(v).replace(/"/g, '""') + '"';
  const rows = [["Place", "Name", "Final time (sec)", "Missed", "Clock time (sec)", "Penalty (sec)", "Date and time"]]
    .concat(getLog().map((r, i) => [i + 1, r.who, r.final.toFixed(1), r.misses, r.time.toFixed(1), r.misses * PENALTY, new Date(r.at).toLocaleString()]));
  const csv = "﻿" + rows.map(r => r.map(q).join(",")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
  a.download = "flag-race-log.csv"; document.body.appendChild(a); a.click(); a.remove();
});
let clrArmed = null;
$("clr").addEventListener("click", () => {
  if (!clrArmed) { $("clr").textContent = "Click again to clear every time"; clrArmed = setTimeout(() => { clrArmed = null; $("clr").textContent = "Clear log"; }, 3500); return; }
  clearTimeout(clrArmed); clrArmed = null; $("clr").textContent = "Clear log";
  store.set("log", []); lastAt = null; drawLog();
});

/* ---------- game ---------- */
let G = null, tick = null;
function show(id) { for (const s of ["start", "game", "results"]) $(s).hidden = s !== id; window.scrollTo(0, 0); }
$("who").value = store.get("who", "");
$("who").addEventListener("input", () => { $("nameMsg").textContent = ""; });
$("who").addEventListener("keydown", e => { if (e.key === "Enter") startGame(); });

function startGame() {
  const who = $("who").value.trim();
  if (!who) { show("start"); $("nameMsg").textContent = "Type your name first so your time goes in the log."; $("who").focus(); return; }
  store.set("who", who);
  G = { who, qs: shuffle(FLAGS.map(f => f.id)), flagOrder: shuffle(FLAGS.map(f => f.id)),
        i: 0, correct: 0, missed: [], locked: false, t0: performance.now() };
  show("game");
  clearInterval(tick);
  tick = setInterval(() => { $("clock").textContent = fmt((performance.now() - G.t0) / 1000); }, 100);
  ask();
}

function ask() {
  const f = byId[G.qs[G.i]];
  G.locked = false;
  $("count").textContent = (G.i + 1) + " of 21";
  $("bar").style.width = (G.i / 21 * 100) + "%";
  $("miss").textContent = G.missed.length + " missed";
  $("say").textContent = ""; $("say").className = "say";
  $("prompt").innerHTML = `<p>Find the flag for</p><div class="word">${f.name}</div>`;
  $("opts").innerHTML = G.flagOrder.map((id, k) => `<button class="opt f" type="button" data-id="${id}" aria-label="Flag choice ${k + 1}"><img src="${byId[id].src}" alt=""></button>`).join("");
}

$("opts").addEventListener("click", e => {
  const btn = e.target.closest(".opt");
  if (!btn || !G || G.locked) return;
  G.locked = true;
  const id = G.qs[G.i], f = byId[id], ok = btn.dataset.id === id;
  const mark = (b, cls, ch) => { b.classList.add(cls); b.insertAdjacentHTML("beforeend", `<span class="mark" aria-hidden="true">${ch}</span>`); };
  $("opts").querySelectorAll(".opt").forEach(b => b.disabled = true);
  if (ok) {
    G.correct++; mark(btn, "right", "✓");
    $("say").textContent = "Correct. " + f.name + "."; $("say").className = "say ok";
  } else {
    G.missed.push(id); mark(btn, "wrong", "✕");
    const right = $("opts").querySelector(`.opt[data-id="${id}"]`); if (right) mark(right, "right", "✓");
    $("miss").textContent = G.missed.length + " missed";
    $("say").textContent = "That was " + byId[btn.dataset.id].name + ". " + f.name + " is marked. +" + PENALTY + " seconds.";
    $("say").className = "say no";
  }
  setTimeout(() => { if (!G) return; G.i++; G.i < 21 ? ask() : finish(); }, ok ? 380 : 1400);
});

$("quit").addEventListener("click", () => { clearInterval(tick); G = null; drawLog(); show("start"); });

/* ---------- results ---------- */
function finish() {
  clearInterval(tick);
  const time = (performance.now() - G.t0) / 1000, misses = G.missed.length, final = time + misses * PENALTY;
  const entry = { who: G.who, final, time, misses, at: Date.now() };
  const raw = store.get("log", []) || []; raw.push(entry); store.set("log", raw.slice(-1000));
  lastAt = entry.at;
  const log = getLog(), place = log.findIndex(r => r.at === entry.at) + 1;
  const acc = Math.round(G.correct / 21 * 100);
  $("bar").style.width = "100%";
  $("card").innerHTML =
    `<h2>${misses === 0 ? "¡Perfecto! All 21 right." : acc >= 80 ? "¡Buen trabajo!" : "Race finished."}</h2>
     <p class="who">${esc(G.who)}, ${when(entry.at)}</p>
     <div class="big">${fmt(final)}</div>
     <p class="math">${fmt(time)} on the clock + ${misses} missed × ${PENALTY} sec = ${fmt(final)}</p>
     ${place === 1 && log.length > 1 ? `<span class="newbest">Fastest time in the log</span>` : ""}
     <p class="place">Place ${place} of ${log.length} in the race log</p>
     <div class="stats">
       <div><b>${acc}%</b><span>accuracy</span></div>
       <div><b>${G.correct} of 21</b><span>correct</span></div>
       <div><b>${fmt(time)}</b><span>clock time</span></div>
     </div>`;
  const uniq = [...new Set(G.missed)];
  $("review").innerHTML = uniq.length
    ? `<h3>Study these before your next race</h3><ul>${uniq.map(id => `<li><img src="${byId[id].src}" alt="">${byId[id].name}</li>`).join("")}</ul>` : "";
  show("results");
}
$("startBtn").addEventListener("click", startGame);
$("again").addEventListener("click", startGame);
$("next").addEventListener("click", () => { $("who").value = ""; drawLog(); show("start"); $("who").focus(); });
$("seelog").addEventListener("click", () => { drawLog(); show("start"); });

drawLog();
</script>
</body>
